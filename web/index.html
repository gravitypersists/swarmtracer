<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmTracer</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10; --panel: #12151a; --fg: #c9d1d9; --dim: #6e7681; --rule: #1b1f26;
    --gen: #f2cc60; --tool: #58a6ff; --wait: #bc8cff; --idle: #3d444d; --sleep: #768390;
    --conn: #8b949e; --err: #f85149; --perm: #e3b341;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--panel); }
  header h1 { font-size: 12px; margin: 0; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  select, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; max-width: 100%; }
  #summary { color: var(--dim); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); margin-left: auto; }
  .legend svg { vertical-align: middle; margin-right: 4px; }
  #body { flex: 1; display: flex; min-height: 0; }
  #timeline { flex: 1; overflow: auto; min-width: 0; }
  #panel { position: relative; width: min(440px, 45vw); flex: none; border-left: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; }
  #panel[hidden] { display: none; }
  @media (max-width: 720px) { #panel { position: fixed; inset: auto 0 0 0; width: 100%; height: 60vh; border-left: 0; border-top: 1px solid var(--rule); z-index: 6; } }
  #panel-close { position: absolute; top: 8px; right: 8px; background: none; border: 0; color: var(--dim); font: 18px/1 inherit; cursor: pointer; padding: 4px 8px; }
  #panel-body { overflow: auto; padding: 14px 16px 24px; font-size: 12px; line-height: 1.5; }
  #panel-body header { margin-bottom: 12px; padding-right: 24px; }
  #panel-body h2 { font-size: 14px; margin: 6px 0 2px; }
  #panel-body h3 { font-size: 12px; margin: 16px 0 6px; color: var(--fg); }
  #panel-body p { margin: 4px 0 10px; }
  #panel-body a { color: var(--tool); text-decoration: none; } #panel-body a:hover { text-decoration: underline; }
  #panel-body pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 8px; margin: 6px 0; max-height: 360px; overflow: auto; }
  #panel-body pre.result { color: var(--dim); }
  #panel-body ul { padding-left: 18px; margin: 4px 0; }
  .prose { white-space: pre-wrap; word-break: break-word; margin: 8px 0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; line-height: 1.55; }
  .thinking { border-left: 2px solid var(--wait); padding-left: 10px; margin: 8px 0; color: #b1bac4; }
  .thinking summary { color: var(--wait); cursor: pointer; font-size: 11px; }
  .note { color: var(--dim); font-style: italic; border-left: 2px solid var(--rule); padding-left: 10px; }
  .call { color: var(--tool); margin: 6px 0; }
  .badge { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; background: var(--rule); color: var(--fg); }
  .badge-generating { background: var(--gen); color: var(--bg); } .badge-tool { background: var(--tool); color: var(--bg); }
  .badge-waiting_on_child { background: var(--wait); color: var(--bg); } .badge-error { background: var(--err); color: var(--bg); }
  .err { color: var(--err); }
  .bar { display: flex; height: 8px; border-radius: 2px; overflow: hidden; margin: 8px 0; gap: 1px; }
  .bar-generating { background: var(--gen); } .bar-tool { background: var(--tool); } .bar-waiting_on_child { background: var(--wait); }
  .bar-idle { background: var(--idle); } .bar-sleeping { background: var(--sleep); }
  .breakdown { list-style: none; padding: 0 !important; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .breakdown i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .excerpt { margin-top: 18px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  .rec-user pre { border-color: #58a6ff44; }
  .seg, .lane-label, .marker, .conn { cursor: pointer; }
  .seg.selected { stroke: var(--fg); stroke-width: 2; }
  rect.seg.selected { stroke-width: 1.5; }
  .lane-label.selected { fill: var(--gen); }
  .marker.selected { fill: var(--fg); }

  .tick { stroke: var(--rule); }
  .tick-label { fill: var(--dim); text-anchor: end; font-size: 10px; }
  .gap { fill: #ffffff05; stroke: var(--rule); stroke-dasharray: 2 4; cursor: zoom-in; }
  .gap-open { fill: #ffffff02; cursor: zoom-out; }
  .gap-label { fill: var(--dim); font-size: 11px; cursor: pointer; }

  .seg-gen { fill: var(--gen); }
  .seg-tool { fill: url(#hatch); stroke: var(--tool); stroke-width: 1; }
  .hatch-bg { fill: #58a6ff22; } .hatch-line { stroke: var(--tool); stroke-width: 1.5; }
  .seg-wait { stroke: var(--wait); stroke-width: 2; stroke-dasharray: 5 4; }
  .seg-idle { stroke: var(--idle); stroke-width: 2; stroke-dasharray: 1 5; stroke-linecap: round; }
  .seg-sleep { stroke: var(--sleep); stroke-width: 2; stroke-dasharray: 1 4; stroke-linecap: round; }
  .seg:hover { filter: brightness(1.4); }

  .conn { fill: none; stroke: var(--conn); stroke-width: 1.25; opacity: .7; }
  .conn-return { stroke-dasharray: 3 3; }
  .lane-label { fill: var(--fg); text-anchor: middle; font-size: 11px; }
  .lane-label.root { font-weight: 700; }
  .cap { stroke: var(--fg); stroke-width: 2; }
  .cap-failed { stroke: var(--err); }
  .cap-truncated { stroke: var(--dim); stroke-dasharray: 2 2; }
  .marker { text-anchor: end; font-size: 11px; fill: var(--dim); cursor: default; }
  .marker-error { fill: var(--err); } .marker-permission { fill: var(--perm); }

  .gap-live { fill: #ffffff04; }
  .now-line { stroke: var(--gen); stroke-width: 1; opacity: .5; }
  .now-label { fill: var(--gen); text-anchor: end; font-size: 10px; }
  .seg.live.seg-gen { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { .seg.live.seg-gen { animation: none; } }
  #live-pill { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 5; font: inherit; color: var(--bg); background: var(--gen); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; box-shadow: 0 4px 16px #0008; }
  #tip { position: fixed; z-index: 10; max-width: min(520px, calc(100vw - 16px)); padding: 8px 10px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; pointer-events: none; box-shadow: 0 6px 24px #0008; }
  #tip div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>SwarmTracer</h1>
  <select id="run" aria-label="Run"></select>
  <label>zoom <input id="zoom" type="range" min="2" max="120" value="24" aria-label="Pixels per second"></label>
  <span id="summary"></span>
  <div class="legend">
    <span><svg width="10" height="12"><rect width="10" height="12" fill="var(--gen)"/></svg>generating</span>
    <span><svg width="10" height="12"><rect width="10" height="12" fill="#58a6ff33" stroke="var(--tool)"/></svg>tool</span>
    <span><svg width="10" height="12"><line x1="5" x2="5" y1="0" y2="12" stroke="var(--wait)" stroke-width="2" stroke-dasharray="4 3"/></svg>waiting on child</span>
    <span><svg width="10" height="12"><line x1="5" x2="5" y1="1" y2="12" stroke="var(--sleep)" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/></svg>idle / sleeping</span>
  </div>
</header>
<div id="body">
  <main id="timeline"></main>
  <aside id="panel" hidden aria-label="Details">
    <button id="panel-close" aria-label="Close details">×</button>
    <div id="panel-body"></div>
  </aside>
</div>
<div id="tip" hidden></div>
<button id="live-pill" hidden>↓ Live</button>
<script type="module" src="/app.js"></script>
</body>
</html>
